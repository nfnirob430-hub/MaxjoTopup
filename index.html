
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAXJO TOPUP</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10121a;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:22px;background:#191c27}
header h1{color:#ff4141;margin:0}
header p{color:#bbb}
.notice{margin:12px;padding:14px;background:#222838;border-radius:12px;border-left:4px solid #ff4141}
.tabs{display:flex;gap:8px;padding:10px}
.tabs button{flex:1;padding:12px 5px;border:0;border-radius:9px;background:#282d3c;color:white;font-weight:bold}
.tabs button.active{background:#ff4141}
.container{padding:12px}
.package{background:#202432;padding:13px;margin:9px 0;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.package button{background:#ff4141;color:white;border:0;border-radius:7px;padding:9px}
input,select{width:100%;padding:12px;margin:7px 0;background:#202432;color:white;border:1px solid #444;border-radius:8px}
.submit{width:100%;padding:14px;background:#ff4141;color:white;border:0;border-radius:9px;font-weight:bold}
.section{display:none}
.section.show{display:block}
footer{text-align:center;padding:20px;color:#aaa}
</style>
</head>
<body>

<header>
<h1>MAXJO TOPUP</h1>
<p>Fast & Trusted Diamond Top Up</p>
</header>

<div class="notice">
<b>NOTICE 1</b><br>
Welcome to MAXJO TOPUP. Order carefully.
</div>

<div class="notice">
<b>NOTICE 2</b><br>
Payment করার আগে UID ভালো করে চেক করুন।
</div>

<div class="tabs">
<button class="active" onclick="tab('diamond',this)">Diamond</button>
<button onclick="tab('weekly',this)">Weekly</button>
<button onclick="tab('monthly',this)">Monthly</button>
</div>

<div class="container">

<div id="diamond" class="section show">
<h3>💎 Diamond Packages</h3>
<div id="diamonds"></div>
</div>

<div id="weekly" class="section">
<h3>📅 Weekly Packages</h3>
<div id="weeklies"></div>
</div>

<div id="monthly" class="section">
<h3>🌙 Monthly Packages</h3>
<div id="monthlies"></div>
</div>

<h3>🛒 Order Form</h3>
<form id="orderForm">
<input id="uid" placeholder="Game UID" required>
<input id="pkg" placeholder="Selected Package" readonly required>
<input id="price" placeholder="Price" readonly required>

<select id="method" required>
<option value="">Payment Method</option>
<option>bKash</option>
<option>Nagad</option>
</select>

<input id="sender" placeholder="আপনার Payment Number" required>
<input id="trx" placeholder="Transaction ID (TrxID)" required>

<button class="submit" type="submit">Submit Order</button>
</form>

<div id="result"></div>

</div>

<footer>
MAXJO TOPUP © 2026
</footer>

<script>
const diamondData=[
["115 Diamond",80],
["240 Diamond",160],
["355 Diamond",240],
["480 Diamond",320],
["610 Diamond",400],
["850 Diamond",560],
["1090 Diamond",720],
["1240 Diamond",820],
["1480 Diamond",980],
["1850 Diamond",1220],
["2180 Diamond",1440],
["2530 Diamond",1660],
["3000 Diamond",1960]
];

const weeklyData=[
["Weekly",155],
["2X Weekly",310],
["3X Weekly",465],
["4X Weekly",620],
["Weekly Lite",35],
["2X Weekly Lite",70],
["3X Weekly Lite",105],
["4X Weekly Lite",140]
];

const monthlyData=[
["Monthly",770],
["2X Monthly",1540],
["3X Monthly",2310],
["4X Monthly",3080],
["Monthly + Weekly",925],
["2X Monthly + Weekly",1695],
["3X Monthly + Weekly",2465],
["4X Monthly + Weekly",3235]
];

function render(list,id){
document.getElementById(id).innerHTML=list.map(p=>
`<div class="package">
<span>${p[0]} - ${p[1]}৳</span>
<button onclick="choose('${p[0]}',${p[1]})">Buy</button>
</div>`
).join("");
}

render(diamondData,"diamonds");
render(weeklyData,"weeklies");
render(monthlyData,"monthlies");

function tab(id,btn){
document.querySelectorAll(".section").forEach(x=>x.classList.remove("show"));
document.getElementById(id).classList.add("show");
document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
btn.classList.add("active");
}

function choose(name,price){
document.getElementById("pkg").value=name;
document.getElementById("price").value=price+" টাকা";
document.getElementById("orderForm").scrollIntoView({behavior:"smooth"});
}

document.getElementById("orderForm").addEventListener("submit",function(e){
e.preventDefault();

document.getElementById("result").innerHTML=
"<div class='notice'>অর্ডারের তথ্য প্রস্তুত হয়েছে। Demo সংস্করণে অর্ডার ডাটাবেজে জমা হয় না।</div>";

});
</script>
</body>
</html>
